[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bagu-trainer"
version = "0.1.0"
description = "发卷平台（bagu-trainer）—— 开源可自托管的八股实战演练所。平台发工单、收 PR、跑确定性验收门并解锁下一关；人类亲手写代码，阅卷在学习者自己的机器上跑，AI 评审是可选的挂件。"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OnlyblackTea" }]
keywords = ["education", "interview-prep", "self-hosted", "exam"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Intended Audience :: Education",
]

# Core runtime: the pure domain layer + content schemas.
# The platform is engine-free (D4): no AI backend is required on the critical path,
# and none is imported. httpx is kept for the future HTTP backends (a Gitea Forge /
# an LLM-backed ReviewEngine); nothing shipped today needs it.
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
# Platform control plane (§2.1) — FastAPI REST control plane.
service = ["fastapi>=0.111", "uvicorn>=0.30"]
# Durable Store (§9.1) — psycopg3 is the SYNC driver on purpose: PlatformService and every
# store method are synchronous, so asyncpg would need an asyncio bridge in the middle.
# (The previous entry here listed sqlalchemy+asyncpg, neither of which was imported anywhere.)
postgres = ["psycopg[binary]>=3.1"]
# Learner-device CLI (§7.2). The form is settled as REST + SPA, so this extra only
# exists for the optional future CLI.
cli = ["typer>=0.12"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/OnlyblackTea/bagu-trainer"
Repository = "https://github.com/OnlyblackTea/bagu-trainer"
Issues = "https://github.com/OnlyblackTea/bagu-trainer/issues"

[tool.setuptools]
packages = ["platform_service", "platform_api", "platform_api.routes", "paper_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
