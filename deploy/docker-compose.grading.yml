# 叠加文件：在这个栈里**真跑**阅卷（maven + Track 的 compose 基础设施）。
#
#   docker compose build --build-arg WITH_GRADING_TOOLCHAIN=1 platform
#   docker compose -f docker-compose.yml -f docker-compose.grading.yml up -d
#
# 三件事必须同时成立，少一件就红在"跟你的代码无关的地方"：
#
# 1. **镜像里有 JDK17 + Maven + docker CLI/compose**（靠上面的 build-arg）；
# 2. **挂 docker socket**：Track 的基础设施（MySQL/Redis）由 `docker compose up -d` 起，
#    而那个守护进程在**宿主机**上。socket = 宿主机的 root 等价权限——只在你自己机器上这么做。
# 3. **工作区在两侧路径一致**：grading 会把 `docker compose -f <工作区>/docker/docker-compose.yml`
#    交给宿主机的守护进程，里面 `./mysql/init` 这类相对路径是按**宿主机**解析的。所以这里把
#    `${BAGU_DATA_DIR}` 绑定挂载到同一个绝对路径，而不是用命名卷（命名卷在宿主机的路径是
#    /var/lib/docker/volumes/... 那串，compose 的相对路径就找不到了）。
services:
  platform:
    environment:
      BAGU_GRADING: docker
      BAGU_GRADING_RESET: "${GRADING_RESET:-auto}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 绑定挂载（不是命名卷）：见上面第 3 条——compose 文件里的相对路径要按宿主机解析。
      - "${BAGU_DATA_DIR:-./data}:/var/lib/bagu"
      - secrets:/run/bagu:ro
      - "${CONTENT_DIR:?deploy/.env 里必须有 CONTENT_DIR}:/content:ro"
