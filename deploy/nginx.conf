# SPA + REST 反代。前缀表与 frontend/vite.config.ts 的代理列表**必须一致**：
# 少一个前缀，那个请求就会打到静态服务器上、拿回 index.html，前端在 JSON.parse 上炸出一句
# 与真实原因毫无关系的错（我们踩过：新加的 /attempts 没进代理）。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端是 SPA：任何非文件路径都交给 index.html 自己路由。
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(tracks|tickets|enrollments|instances|submissions|attempts|meta)(/|$) {
        proxy_pass http://platform:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # provision 会在后端本机 clone/ fetch 一个仓库；别让默认的 60s 读超时把它掐断。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
